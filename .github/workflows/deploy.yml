name: BizzSoft V5 Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Get the latest source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Prepare Node.js environment on GitHub Actions
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install frontend dependencies
      - name: Install Node Dependencies
        run: npm ci

      # 4. Build React / Vite production assets
      - name: Build React Application
        run: npm run build

      # 5. Make sure both V5 build directories exist on Hostinger
      - name: Prepare V5 Build Directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 145.79.28.207
          username: u180948312
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          script: |
            mkdir -p /home/u180948312/laravel_v5/public/build
            mkdir -p /home/u180948312/domains/bizzsoft.dev/public_html/build

      # 6. Upload React build to Laravel V5 public directory
      - name: Upload React Build to Laravel V5
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 145.79.28.207
          username: u180948312
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          source: "public/build/*"
          target: "/home/u180948312/laravel_v5/public/build"

      # 7. Upload React build to live public_html
      - name: Upload React Build to Public HTML
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 145.79.28.207
          username: u180948312
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          source: "public/build/*"
          target: "/home/u180948312/domains/bizzsoft.dev/public_html/build"

      # 8. Deploy Laravel application
      - name: Deploy Laravel Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 145.79.28.207
          username: u180948312
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          script: |
            cd /home/u180948312/laravel_v5

            echo "Current Directory:"
            pwd

            echo "Pulling latest code..."
            git pull origin main || exit 1

            echo "Installing Composer Dependencies..."
            /opt/alt/php83/usr/bin/php -d "disable_functions=" /usr/local/bin/composer2 install --no-interaction --prefer-dist --optimize-autoloader || exit 1

            echo "Running Database Migrations..."
            /opt/alt/php83/usr/bin/php artisan migrate --force || exit 1

            echo "Optimizing Laravel..."
            /opt/alt/php83/usr/bin/php artisan optimize || exit 1

            echo "✅ BizzSoft V5 deployment completed successfully!"